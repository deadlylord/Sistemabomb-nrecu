<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Luxury Dark) -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Vibrant Brand Gradients -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#00aaff" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Subtle Shadows & Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ff007f" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00aaff" flood-opacity="0.35" />
    </filter>
    
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base App Icon Rounded Canvas (Squirqle iOS/Android standard) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="113" fill="none" stroke="url(#brandGrad)" stroke-width="3" stroke-opacity="0.3" />

  <!-- Background Decorative Glass Ring -->
  <circle cx="256" cy="246" r="176" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  <circle cx="256" cy="246" r="148" fill="none" stroke="url(#brandGrad)" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8 6" />

  <!-- Main Central POS / Shopping Bag + Diamond Sparkle Retail Vector Symbol -->
  <g filter="url(#glow)" transform="translate(0, -6)">
    <!-- Shopping Bag Body -->
    <path d="M166 190 C166 172, 180 158, 198 158 L314 158 C332 158, 346 172, 346 190 L366 332 C368 348, 355 362, 339 362 L173 362 C157 362, 144 348, 146 332 Z" 
          fill="url(#brandGrad)" />

    <!-- Bag Handle Arc -->
    <path d="M210 166 V134 C210 108, 230 88, 256 88 C282 88, 302 108, 302 134 V166" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="14" 
          stroke-linecap="round" />

    <!-- POS Retail Lightning / Smart Sparkle / Diamond inside the Bag -->
    <path d="M256 198 L274 246 L322 256 L274 266 L256 314 L238 266 L190 256 L238 246 Z" 
          fill="#ffffff" 
          filter="url(#subtleShadow)" />

    <!-- Mini Star Sparkles -->
    <circle cx="204" cy="208" r="4" fill="#ffffff" opacity="0.9" />
    <circle cx="308" cy="312" r="5" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Modern POS Receipt Wave / Terminal Tray detail -->
  <path d="M200 362 L200 376 C200 380, 204 384, 208 384 L304 384 C308 384, 312 380, 312 376 L312 362" 
        fill="rgba(255,255,255,0.2)" />

  <!-- Bottom Elegant Universal Badge: "POS" -->
  <g transform="translate(256, 436)">
    <rect x="-76" y="-22" width="152" height="44" rx="22" fill="#0f172a" stroke="url(#brandGrad)" stroke-width="2" />
    <text x="0" y="7" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="20" 
          font-weight="900" 
          letter-spacing="5" 
          fill="#ffffff" 
          text-anchor="middle">POS</text>
  </g>
</svg>
