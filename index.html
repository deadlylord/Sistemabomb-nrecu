  <script>
    // Parche definitivo y agresivo para corregir "TypeError: Cannot set property fetch of #<Window> which has only a getter"
    // Este error ocurre cuando un polyfill intenta sobrescribir window.fetch en entornos restrictivos.
    (function() {
      try {
        const descriptor = Object.getOwnPropertyDescriptor(window, 'fetch') || 
                           Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
        
        if (descriptor && !descriptor.writable && !descriptor.set) {
          const originalFetch = window.fetch;
          if (typeof originalFetch === 'function') {
            try {
              // Intentamos borrar para luego redefinir
              delete window.fetch;
            } catch (e) {}

            Object.defineProperty(window, 'fetch', {
              value: originalFetch,
              writable: true,
              configurable: true,
              enumerable: true
            });
            console.log("Parche de fetch aplicado con éxito.");
          }
        }
      } catch (e) {
        console.warn("No se pudo aplicar el parche de fetch:", e);
      }
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      const registerServiceWorker = () => {
        const swUrl = new URL('/sw.js?v=1.1.146', window.location.origin);
        navigator.serviceWorker.register(swUrl, { updateViaCache: 'none' }).then(registration => {
          console.log('ServiceWorker registration successful with scope: ', registration.scope);
        }, err => {
          console.log('ServiceWorker registration failed: ', err);
        });
      };

      const tryRegister = () => {
        // This is the definitive fix. By using setTimeout with 0ms, we push the registration
        // to the very end of the browser's event queue. This ensures that every other script,
        // including React's rendering and hydration, has fully completed. It's the most
        // robust way to break subtle race conditions in complex environments.
        setTimeout(() => {
            registerServiceWorker();
        }, 0);
      };
      
      // We still wait for the 'load' event to be absolutely sure the page is ready,
      // and then we use the setTimeout trick to guarantee a stable state.
      if (document.readyState === 'complete') {
        tryRegister();
      } else {
        window.addEventListener('load', tryRegister);
      }
    }
  </script>
